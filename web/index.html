<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AN · Monster Grove</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./">✳ AN<span>MONSTER GROVE</span></a><button id="lang">English ↗</button></header>
<main><section class="intro"><div class="eyebrow">EXPEDITION 001 / THE EMERALD WOODS</div><h1 id="title"></h1><p id="subtitle"></p></section>
<div class="difficulty-bar"><label for="difficulty" id="difficultyLabel">Độ khó</label><select id="difficulty"><option value="easy">Dễ</option><option value="normal">Thường</option><option value="hard" selected>Khó</option><option value="expert">Chuyên gia</option></select><small id="difficultyHint"></small></div><div class="layout"><section class="game panel"><div class="top"><div><span class="dot"></span> <b id="region"></b></div><span id="modeLabel"></span></div><div class="stats"><div><small id="healthLabel"></small><strong id="health"></strong></div><div><small id="exploredLabel"></small><strong id="explored"></strong></div><div><small id="caughtLabel"></small><strong id="caught"></strong></div></div><div id="board" aria-label="Exploration grid"></div><div class="toolbar"><button id="revealMode"></button><button id="flagMode"></button><button id="reset"></button></div><p class="hint" id="hint"></p></section>
<aside><section class="panel companion"><span class="eyebrow" id="partnerLabel"></span><div class="creature">🌱<span>✦</span></div><h2>Mochi</h2><p id="partnerText"></p><div class="badge">LEAF / LV. 05</div></section><section class="panel journal"><div class="eyebrow" id="journalLabel"></div><div id="log" aria-live="polite"></div></section></aside></div><footer id="footer"></footer></main>
<dialog id="battle"><div class="eyebrow" id="battleLabel"></div><div class="enemy" id="enemyIcon"></div><h2 id="enemyName"></h2><p id="battleText" aria-live="polite"></p><div class="meter"><div id="enemyHP"></div></div><p id="battleHP"></p><div class="actions"><button id="attack"></button><button id="capture"></button><button id="guard"></button></div></dialog>
<script src="game.js"></script></body></html>
